<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>SaudINOB - Portal Médico</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: #f5fcff;
      color: #092b4c;
      display: flex;
    }

    /* --- SIDEBAR GENERALISTA --- */
    .sidebar {
      width: 260px;
      background: #07213b;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 24px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      border-right: 1px solid rgba(99, 179, 237, 0.15);
    }

    /* Bloco do Utilizador Logado (Dinâmico) */
    .perfil-medico {
      text-align: center;
      padding-bottom: 30px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .perfil-foto {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #1a365d;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      border: 3px solid #75d0fb;
      font-size: 2rem;
      color: #75d0fb;
      overflow: hidden;
    }

    .perfil-foto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .perfil-nome {
      font-size: 1.1rem;
      font-weight: 600;
      color: #ffffff;
    }

    .perfil-especialidade {
      font-size: 0.8rem;
      color: #75d0fb;
      margin-top: 2px;
    }

    /* Menu de Navegação */
    .sidebar-menu {
      flex: 1;
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      color: #dfe8f6;
      text-decoration: none;
      font-size: 0.95rem;
      border-radius: 12px;
      transition: all 0.2s ease;
    }

    .menu-item i {
      font-size: 1.2rem;
      width: 24px;
      text-align: center;
    }

    .menu-item:hover, .menu-item.active {
      background: #0b75ff;
      color: #ffffff;
      font-weight: 600;
      box-shadow: 0 4px 12px rgba(11, 117, 255, 0.2);
    }

    /* Botão Sair */
    .btn-logout {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      color: #fca5a5;
      text-decoration: none;
      font-size: 0.95rem;
      border-radius: 12px;
      transition: all 0.2s ease;
      border: 1px solid rgba(239, 68, 68, 0.2);
    }

    .btn-logout:hover {
      background: #ef4444;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.2);
    }

    /* --- ÁREA DE CONTEÚDO --- */
    .main-conteudo {
      margin-left: 260px;
      padding: 48px;
      width: 100%;
    }

    .cabecalho-pagina {
      margin-bottom: 32px;
    }

    .cabecalho-pagina h1 {
      font-size: 2.2rem;
      color: #092b4c;
    }

    /* Estrutura da Tabela de Utentes */
    .tabela-utentes {
      width: 100%;
      border-collapse: collapse;
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
    }

    .tabela-utentes th, .tabela-utentes td {
      padding: 16px 24px;
      text-align: left;
    }

    .tabela-utentes th {
      background: #f1f5f9;
      color: #64748b;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .tabela-utentes tr {
      border-bottom: 1px solid #f1f5f9;
    }

    .btn-acao {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #0b75ff;
      background: transparent;
      color: #0b75ff;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
    }

    .btn-acao:hover {
      background: #0b75ff;
      color: #ffffff;
    }
  </style>
</head>
<body>

  <aside class="sidebar">
    
    <div class="perfil-medico">
      <div class="perfil-foto" id="medicoFoto">
        <i class="fa-solid fa-user-doctor"></i>
      </div>
      <div class="perfil-nome" id="medicoNome">Nome do Médico</div>
      <div class="perfil-especialidade" id="medicoEspecialidade">Especialidade</div>
    </div>

    <nav class="sidebar-menu">
      <a href="dashboard.html" class="menu-item">
        <i class="fa-solid fa-chart-pie"></i> Painel Geral
      </a>
      <a href="utentes.html" class="menu-item active">
        <i class="fa-solid fa-hospital-user"></i> Ver Utentes
      </a>
      <a href="alertas.html" class="menu-item">
        <i class="fa-solid fa-bell"></i> Alertas Ativos
      </a>
    </nav>

    <a href="logout.php" class="btn-logout">
      <i class="fa-solid fa-right-from-bracket"></i> Terminar Sessão
    </a>

  </aside>

  <main class="main-conteudo">
    
    <div class="cabecalho-pagina">
      <h1>Os Meus Utentes</h1>
      <p style="color: #64748b; margin-top: 4px;">Listagem de pacientes associados ao seu perfil clínico.</p>
    </div>

    <table class="tabela-utentes">
      <thead>
        <tr>
          <th>Utente</th>
          <th>Nº Processo</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="listaUtentes">
        <tr>
          <td><strong>Nome do Paciente</strong></td>
          <td>#0000</td>
          <td><button class="btn-acao">Consultar Ficha</button></td>
        </tr>
      </tbody>
    </table>

  </main>

</body>
</html>
