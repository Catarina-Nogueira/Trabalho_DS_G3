<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <title>SaudINOB - Painel do Médico</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: #f5fcff;
      color: #092b4c;
      display: flex;
    }

    /* --- 1) BARRA LATERAL DO MÉDICO --- */
    .sidebar {
      width: 260px;
      background: #07213b;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 24px;
      position: fixed;
      top: 0;
      bottom: 0;
      left: 0;
      z-index: 100;
      border-right: 1px solid rgba(99, 179, 237, 0.15);
    }

    .perfil-medico {
      text-align: center;
      padding-bottom: 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .perfil-foto {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: #1a365d;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 12px;
      border: 3px solid #75d0fb;
      font-size: 2.2rem;
      color: #75d0fb;
    }

    .perfil-nome { font-size: 1.1rem; font-weight: 600; color: #ffffff; word-break: break-word; }
    .perfil-tipo { font-size: 0.8rem; color: #75d0fb; margin-top: 2px; text-transform: uppercase; letter-spacing: 1px; }
    .perfil-especialidade { font-size: 0.85rem; color: #dfe8f6; margin-top: 4px; font-style: italic; }

    .sidebar-menu-central {
      margin: auto 0;
      display: flex;
      flex-direction: column;
    }

    .btn-destaque-utentes {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 16px 20px;
      background: #0b75ff;
      color: #ffffff;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 14px;
      box-shadow: 0 4px 14px rgba(11, 117, 255, 0.3);
      transition: all 0.2s ease;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-destaque-utentes:hover {
      background: #0056cc;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(11, 117, 255, 0.4);
    }

    .sidebar-footer {
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .btn-logout {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 14px 18px;
      color: #fca5a5;
      text-decoration: none;
      font-size: 0.95rem;
      border-radius: 12px;
      transition: all 0.2s ease;
      border: 1px solid rgba(239, 68, 68, 0.2);
      cursor: pointer;
    }
    .btn-logout:hover { background: #ef4444; color: #ffffff; }

    /* --- 2) CONTEÚDO PRINCIPAL --- */
    .main-conteudo {
      margin-left: 260px;
      padding: 48px;
      width: calc(100% - 260px);
      max-width: 1200px;
    }

    .cabecalho-pagina { margin-bottom: 32px; }
    .cabecalho-pagina h1 { font-size: 2.2rem; color: #092b4c; }
    .cabecalho-pagina p { color: #64748b; margin-top: 4px; font-size: 1.05rem; }

    /* --- TABELA E CLASSE DE BADGES --- */
    .tabela-container {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 16px rgba(0,0,0,0.02);
      border: 1px solid #e2e8f0;
    }

    .tabela-alertas { width: 100%; border-collapse: collapse; text-align: left; }
    .tabela-alertas th, .tabela-alertas td { padding: 18px 24px; border-bottom: 1px solid #f1f5f9; font-size: 0.95rem; }
    
    .tabela-alertas th {
      background: #f8fafc;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.8rem;
      letter-spacing: 0.5px;
    }

    .tabela-alertas tr:last-child td { border-bottom: none; }
    .tabela-alertas tr:hover { background: #f8fcff; }

    .nome-utente { font-weight: 600; color: #092b4c; }
    .motivo-alerta { color: #475569; font-size: 0.9rem; margin-top: 4px; display: block; font-style: italic; }
    
    /* Enums de Prioridade */
    .badge-prioridade { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; text-transform: uppercase; }
    .prio-alta { background: #fee2e2; color: #991b1b; }
    .prio-media { background: #fef9c3; color: #a16207; }
    .prio-baixa { background: #e0f2fe; color: #0369a1; }
    
    /* Enums de Estado */
    .estado-alerta { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: #475569; text-transform: capitalize; }
    .ponto-estado { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
    .ponto-novo { background: #ef4444; }
    .ponto-visto { background: #3b82f6; }
    .ponto-em_seguimento { background: #f59e0b; }
    .ponto-fechado { background: #10b981; }
    
    .btn-detalhes { color: #0b75ff; text-decoration: none; font-weight: 600; font-size: 0.9rem; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; border: none; background: none; }
    .btn-detalhes:hover { color: #0056cc; }

    .estado-vazio { text-align: center; padding: 40px; color: #94a3b8; font-size: 1rem; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="perfil-medico">
      <div class="perfil-foto"><i class="fa-solid fa-user-doctor"></i></div>
      <div class="perfil-nome" id="nome-medico-sidebar">A carregar...</div>
      <div class="perfil-tipo">Médico</div>
      <div class="perfil-especialidade" id="especialidade-medico">Pneumologia</div>
    </div>
    
    <div class="sidebar-menu-central">
      <a href="listagemUtentes.html" class="btn-destaque-utentes">
        <i class="fa-solid fa-address-book"></i> Listagem de Utentes
      </a>
    </div>
    
    <div class="sidebar-footer">
      <a href="#" class="btn-logout" id="btnLogout">
        <i class="fa-solid fa-right-from-bracket"></i> Terminar Sessão
      </a>
    </div>
  </aside>

  <main class="main-conteudo">
    
    <div class="cabecalho-pagina">
      <h1>Centro de Alertas Clínicos</h1>
      <p>Alertas ordenados por prioridade clínica e ordem cronológica.</p>
    </div>

    <div class="tabela-container">
      <table class="tabela-alertas">
        <thead>
          <tr>
            <th>Utente</th>
            <th>Tipo de Alerta</th>
            <th>Prioridade</th>
            <th>Data de Criação</th>
            <th>Estado</th>
            <th style="text-align: right;">Ações</th>
          </tr>
        </thead>
        <tbody id="listaAlertas">
          <tr>
            <td colspan="6" class="estado-vazio">A carregar alertas...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </main>

  <script>
    const API_BASE = "http://localhost:3000";
    let idMedicoGlobal = null;

    document.addEventListener("DOMContentLoaded", () => {
      const token = verificarEConfigurarSessao();
      if (!token) return;

      carregarPerfilMedico(token);

      carregarAlertasDoService(token);
      configurarLogout();
    });

    function redirecionarLogin() {
      localStorage.clear();
      window.location.href = 'autenticacao.html';
    }

    function verificarEConfigurarSessao() {
      const token = localStorage.getItem('token');
      const userRaw = localStorage.getItem('user');

      if (!token || !userRaw) {
        redirecionarLogin();
        return null;
      }

      let utilizador;
      try {
        utilizador = JSON.parse(userRaw);
      } catch (e) {
        redirecionarLogin();
        return null;
      }
      
      if(!utilizador.tipo || utilizador.tipo.toLowerCase() != 'medico'){
        redirecionarLogin();
        return null;
      }

      // Injeta dinamicamente o nome do médico guardado no login
      document.getElementById('nome-medico-sidebar').textContent = utilizador.nome || "Medico";
      idMedicoGlobal = utilizador.id_especifico;
      
      // Se tiveres a especialidade guardada no utilizador, podes mapeá-la aqui também:
      if (utilizador.especialidade) {
        document.getElementById('especialidade-medico').textContent = utilizador.especialidade;
      }

      if (!idMedicoGlobal) {
        console.error ("ID do médico não encontrado no localStorage");
        redirecionarLogin();
        return null;
      }
      return token;
    }

    async function carregarPerfilMedico(token) {
      try {
        const resposta = await fetch(
          `${API_BASE}/medicos/${idMedicoGlobal}`,
          {
            headers: {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json"
            }
          }
        );

        if (!resposta.ok) {
          throw new Error("Erro ao obter médico");
        }

        const medico = await resposta.json();

        document.getElementById("nome-medico-sidebar").textContent =
          medico.nome;

        document.getElementById("especialidade-medico").textContent =
          medico.especialidade || "Sem especialidade";
      }
      catch (erro) {
        console.error("Erro ao carregar médico:", erro);
      }
    }

    function configurarLogout() {
      document.getElementById("btnLogout").addEventListener("click", (e) => {
        e.preventDefault();
        localStorage.clear();
        window.location.href = "autenticacao.html";
      });
    }

    async function carregarAlertasDoService(token) {
      const tbody = document.getElementById('listaAlertas');
      
      try {
        // Consome a rota do AlertaRouter: router.get('/medico', ...)
        const resposta = await fetch(`${API_BASE}/alertas/medico/${idMedicoGlobal}`, {
          method: "GET",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          }
        });

        if (!resposta.ok) throw new Error("Erro ao obter alertas do servidor.");
        
        const alertas = await resposta.json();
        console.log("Alertas recebidos:", alertas);
        console.log("Número de alertas:", alertas.length);
        
        if (!alertas || alertas.length === 0) {
          tbody.innerHTML = `<tr><td colspan="6" class="estado-vazio"><i class="fa-solid fa-bell-slash"></i> Sem alertas clínicos pendentes de momento.</td></tr>`;
          return;
        }

        // Mapeamento textual amigável dos Tipos de Alerta (Enum TipoAlerta)
        const traducaoTipos = {
          'score_carat': 'Score Baixo CARAT',
          'sintoma_grave': 'Sintoma Grave Reportado',
          'medicacao': 'Alteração de Medicação',
          'exame_pendente': 'Exame Pendente',
          'sem_avaliacao': 'Ausência de Avaliação'
        };

        tbody.innerHTML = alertas.map(alerta => {
          // Formatação da data vinda do @CreateDateColumn
          const dataCriacao = new Date(alerta.data_criacao).toLocaleDateString("pt-PT", {
            day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit"
          });

          // Tratamento do nome do utente a partir do relacionamento JoinColumn
          const nomeUtente = alerta.utente ? alerta.utente.nome : "Utente Desconhecido";
          
          // Mapeamento limpo das classes CSS conforme os Enums fornecidos
          const classePrioridade = `prio-${alerta.prioridade}`; // prio-alta, prio-media, prio-baixa
          const classePonto = `ponto-${alerta.estado}`;       // ponto-novo, ponto-visto, etc.
          
          // Formata o estado visual removendo underscores para exibição (ex: em_seguimento -> em seguimento)
          const textoEstado = alerta.estado.replace('_', ' ');

          return `
            <tr>
              <td>
                <span class="nome-utente">${nomeUtente}</span>
              </td>
              <td>
                <strong>${traducaoTipos[alerta.tipo] || alerta.tipo}</strong>
                <span class="motivo-alerta">${alerta.motivo}</span>
              </td>
              <td>
                <span class="badge-prioridade ${classePrioridade}">${alerta.prioridade}</span>
              </td>
              <td>${dataCriacao}</td>
              <td>
                <span class="estado-alerta">
                  <span class="ponto-estado ${classePonto}"></span>
                  ${textoEstado}
                </span>
              </td>
              <td style="text-align: right;">
                <button class="btn-detalhes" onclick="verDetalhesAlerta(${alerta.id})">
                  <i class="fa-solid fa-magnifying-glass-chart"></i> Analisar
                </button>
              </td>
            </tr>
          `;
        }).join('');

      } catch (error) {
        console.error("Erro ao carregar dados do service:", error);
        tbody.innerHTML = `<tr><td colspan="6" class="estado-vazio" style="color: #ef4444;"><i class="fa-solid fa-triangle-exclamation"></i> Falha ao carregar a lista de alertas médicos.</td></tr>`;
      }
    }

    // Função auxiliar para gatilho de ação no clique de cada alerta
    function verDetalhesAlerta(idAlerta) {
      // Aqui podes redirecionar para a página de tratamento ou abrir um modal de revisão
      window.location.href = `detalheAlerta.html?id=${idAlerta}`;
    }
  </script>
</body>
</html>
